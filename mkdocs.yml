site_name: Desarrollo Web
site_url: https://atorrescode.github.io/dw/
# docs_dir: md
# site_dir: docs
theme:
   name: 'material'
   features:
    - navigation.sections
    - navigation.top
    - content.code.copy
   font:
    text: 'Roboto, sans-serif'
    code: 'Courier New, monospace'
   icon:
    repo: 'fontawesome/brands/github'
   palette:
    - scheme: default
      toggle:
          icon: material/brightness-7 
          name: Canvia a mode oscur

    - scheme: slate
      toggle:
          icon: material/brightness-4
          name: Canvia a mode clar
   logo: assets/img/pato_pixelart_icono.ico
   favicon: assets/img/pato_pixelart_icono.ico

nav:
    - Home: index.md
    - Unidad 1. Introducción al desarrollo web:
      - 1. Arquitecturas web: u01-introduccion-desarrollo-web/r01-arquitecturas-web.md
      - Actividades: u01-introduccion-desarrollo-web/a01.md
    - Unidad 2. JavaScript:
      - 1. Introducción a JavaScript: u02-javascript/r01-introduccion-js.md
      - 2. Bucles y funciones: u02-javascript/r02-bucles-funciones.md
      - 3. Objetos: u02-javascript/r03-objetos.md
      - 4. Arrays: u02-javascript/r04-arrays.md
      - 5. Manejo de errores: u02-javascript/r05-errores.md
      - 6. Promesas y async/await: u02-javascript/r06-promesas-async-await.md
      - Actividades introducción: u02-javascript/a01.md
      - Actividades bucles, funciones, objetos y arrays: u02-javascript/a02.md
      - Actividades resueltas arrays: u02-javascript/a03.md
    - Unidad 3. Entorno del navegador y DOM:
      - 1. Entorno del navegador y DOM: u03-dom/r01-entorno-dom.md
      - 2. Eventos de la interfaz: u03-dom/r02-eventos-ui.md
      - 3. Solicitudes de red con fetch y FormData: u03-dom/r03-fetch-formdata.md
      - 4. Almacenamiento en el navegador: u03-dom/r04-almacenamiento-navegador.md
extra_css:
  - assets/css/style.css
extra_templates:
plugins:
  - search
  # - with-pdf
  # - pdf-export:
  #     combined: true
  # - page-to-pdf
markdown_extensions:
  # Avisos: !!! note, !!! warning, !!! tip...
  - admonition

  # Bloques desplegables: ??? question, ???+ example...
  - pymdownx.details

  # Resaltado de código
  - pymdownx.highlight:
      linenums: true
      anchor_linenums: true

  # Bloques de código avanzados y Mermaid
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # Listas de tareas: - [ ] y - [x]
  - pymdownx.tasklist:
      custom_checkbox: true

  # Permite añadir atributos a elementos Markdown
  - attr_list

  # Permite combinar Markdown dentro de HTML
  - md_in_html

  # Notas al pie
  - footnotes